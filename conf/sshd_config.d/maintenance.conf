# OpenSSH Maintenance Configuration for TryHackMe
# Strictly isolated to TCP 2222. TCP 22 is reserved for WOPR AsyncSSH.

Port 2222
ListenAddress 0.0.0.0
ListenAddress ::

# Security Hardening
PermitRootLogin no
X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no
MaxAuthTries 5

# Authentication isolation
PasswordAuthentication no
AllowUsers thmadmin

Match User thmadmin
    PasswordAuthentication yes
